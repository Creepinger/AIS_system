<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>船舶AIS信息解析系统</title>
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          crossorigin="" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <header class="topbar">
        <div class="title">船舶AIS信息解析系统</div>
        <div class="controls">
            <select id="source-kind">
                <option value="file">文件回放</option>
                <option value="serial">串口</option>
                <option value="net">网口</option>
            </select>
            <input id="source-path" type="text"
                   placeholder="file: 文本路径 / serial: COM3 / net: 1.2.3.4:5000" />
            <button id="btn-apply">应用</button>
            <input id="upload-file" type="file" accept=".txt,.log" hidden />
            <button id="btn-upload">上传文件</button>
            <button id="btn-pause">暂停</button>
            <button id="btn-resume">继续</button>
            <button id="btn-clear">清空</button>
            <span id="ws-state" class="ws-state off">断开</span>
        </div>
    </header>

    <main class="layout">
        <section id="map" class="map"></section>
        <aside class="sidebar">
            <div class="stats-card">
                <div class="stat"><span class="lbl">收包</span><b id="stat-rx">0</b></div>
                <div class="stat"><span class="lbl">BCC</span><b id="stat-bcc">0/0</b></div>
                <div class="stat"><span class="lbl">解码</span><b id="stat-dec">0</b></div>
                <div class="stat"><span class="lbl">船舶</span><b id="stat-count">0</b></div>
                <div class="stat full"><span class="lbl">类型</span><b id="stat-types">-</b></div>
                <div class="stat full"><span class="lbl">源</span><b id="stat-source">-</b></div>
            </div>
            <div class="ship-list">
                <div class="ship-list-head">
                    <span>MMSI</span><span>纬度</span><span>经度</span>
                    <span>航速</span><span>航向</span><span>船名</span>
                </div>
                <div id="ship-list-body" class="ship-list-body"></div>
            </div>
        </aside>
    </main>

    <footer class="footer">
        <span>AIS Decoding System</span>
        <span id="footer-ws">WebSocket: -</span>
        <span>Leaflet + OpenStreetMap</span>
        <span>由 FastAPI + WebSocket 驱动</span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            crossorigin=""></script>
    <script src="/static/js/ws_client.js"></script>
    <script src="/static/js/map.js"></script>
    <script src="/static/js/stats.js"></script>
</body>
</html>
