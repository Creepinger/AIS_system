<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>船舶AIS信息解析系统</title>
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          crossorigin="" />
    <link rel="stylesheet" href="/static/css/style.css?v=20260712" />
</head>
<body>
    <header class="topbar">
        <div class="title-group">
            <span class="title-icon" aria-hidden="true">
                <!-- 罗盘 + 船 主题图标 -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                     fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9" />
                    <polygon points="12,4 14,12 12,11 10,12"
                             fill="#f97316" stroke="#f97316" />
                    <polygon points="12,20 10,12 12,13 14,12"
                             fill="#2dd4bf" stroke="#2dd4bf" />
                    <circle cx="12" cy="12" r="1.2" fill="#e3e9f0" stroke="none" />
                </svg>
            </span>
            <div class="title">船舶AIS信息解析系统</div>
        </div>
        <div class="controls">
            <select id="source-kind" autocomplete="off">
                <option value="file">文件回放</option>
                <option value="net">网口</option>
            </select>
            <input id="source-path" type="text" autocomplete="off"
                   placeholder="file: 文本路径 / net: 1.2.3.4:5000" />
            <button id="btn-apply">应用</button>
            <input id="upload-file" type="file" accept=".txt,.log" hidden />
            <button id="btn-upload">上传文件</button>
            <button id="btn-pause">暂停</button>
            <button id="btn-resume">继续</button>
            <button id="btn-clear">清空</button>
            <span id="ws-state" class="ws-state off">断开</span>
        </div>
    </header>

    <main class="layout">
        <section id="map" class="map">
            <!-- 右上角: 指北针罗盘叠加层 -->
            <div class="map-compass" aria-hidden="true">
                <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18"
                            fill="none" stroke="rgba(45,212,191,0.4)" stroke-width="1" />
                    <circle cx="20" cy="20" r="14"
                            fill="none" stroke="rgba(120,180,220,0.18)" stroke-width="0.6" />
                    <!-- 指北针双菱形 -->
                    <polygon points="20,5 23,20 20,18 17,20"
                             fill="#f97316" stroke="#ffffff" stroke-width="0.8" />
                    <polygon points="20,35 17,20 20,22 23,20"
                             fill="#2dd4bf" stroke="#ffffff" stroke-width="0.8" />
                    <circle cx="20" cy="20" r="1.6" fill="#e3e9f0" />
                    <!-- N/S/E/W 标记 -->
                    <text x="20" y="3.5" text-anchor="middle"
                          font-size="4" fill="#2dd4bf"
                          font-family="-apple-system, sans-serif" font-weight="700">N</text>
                    <text x="20" y="38.5" text-anchor="middle"
                          font-size="3.5" fill="#8ea0b4"
                          font-family="-apple-system, sans-serif" font-weight="600">S</text>
                    <text x="36.5" y="21.5" text-anchor="middle"
                          font-size="3.5" fill="#8ea0b4"
                          font-family="-apple-system, sans-serif" font-weight="600">E</text>
                    <text x="3.5" y="21.5" text-anchor="middle"
                          font-size="3.5" fill="#8ea0b4"
                          font-family="-apple-system, sans-serif" font-weight="600">W</text>
                </svg>
            </div>

            <!-- 右下角: 船舶颜色图例 (可折叠) -->
            <div id="map-legend" class="map-legend">
                <div class="map-legend-head"
                     onclick="var el=document.getElementById('map-legend'); if(el){el.classList.toggle('collapsed');}">
                    <span>船舶类型图例</span>
                    <span class="legend-toggle" aria-hidden="true">
                        <svg viewBox="0 0 16 16" width="12" height="12"
                             xmlns="http://www.w3.org/2000/svg"
                             fill="none" stroke="currentColor" stroke-width="1.6"
                             stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3,6 8,11 13,6" />
                        </svg>
                    </span>
                </div>
                <div class="map-legend-body">
                    <div class="legend-item msg1">
                        <span class="legend-dot"></span>
                        <span>A 类 (msg 1)</span>
                    </div>
                    <div class="legend-item msg5">
                        <span class="legend-dot"></span>
                        <span>静态 (msg 5)</span>
                    </div>
                    <div class="legend-item msg18">
                        <span class="legend-dot"></span>
                        <span>B 类 (msg 18)</span>
                    </div>
                    <div class="legend-item msgoth">
                        <span class="legend-dot"></span>
                        <span>其他类型</span>
                    </div>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <div class="stats-card">
                <div class="stat">
                    <span class="icon-container" aria-hidden="true">
                        <!-- 收包: 下载/流入箭头 -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3v12" />
                            <polyline points="7,11 12,16 17,11" />
                            <path d="M4 20h16" />
                        </svg>
                    </span>
                    <span class="stat-text">
                        <span class="lbl">收包</span>
                        <b id="stat-rx">0</b>
                    </span>
                </div>

                <div class="stat">
                    <span class="icon-container" aria-hidden="true">
                        <!-- BCC: 校验盾牌 -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z" />
                            <polyline points="8.5,12 11,14.5 15.5,9.5" />
                        </svg>
                    </span>
                    <span class="stat-text">
                        <span class="lbl">BCC</span>
                        <b id="stat-bcc">0/0</b>
                    </span>
                </div>

                <div class="stat">
                    <span class="icon-container" aria-hidden="true">
                        <!-- 解码: CPU 芯片 -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round">
                            <rect x="6" y="6" width="12" height="12" rx="1.5" />
                            <rect x="9.5" y="9.5" width="5" height="5" rx="0.5" />
                            <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3" />
                        </svg>
                    </span>
                    <span class="stat-text">
                        <span class="lbl">解码</span>
                        <b id="stat-dec">0</b>
                    </span>
                </div>

                <div class="stat">
                    <span class="icon-container" aria-hidden="true">
                        <!-- 船舶数: 船形 -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 18l1.5-5h15L21 18" />
                            <path d="M5 13V8l7-3 7 3v5" />
                            <path d="M12 5V3" />
                            <path d="M2 18h20l-2 3H4l-2-3z" />
                        </svg>
                    </span>
                    <span class="stat-text">
                        <span class="lbl">船舶</span>
                        <b id="stat-count">0</b>
                    </span>
                </div>

                <div class="stat full">
                    <span class="icon-container" aria-hidden="true">
                        <!-- 类型: 分层 -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12,3 22,8 12,13 2,8" />
                            <polyline points="2,12 12,17 22,12" />
                            <polyline points="2,16 12,21 22,16" />
                        </svg>
                    </span>
                    <span class="stat-text">
                        <span class="lbl">类型</span>
                        <b id="stat-types">-</b>
                    </span>
                </div>

                <div class="stat full">
                    <span class="icon-container" aria-hidden="true">
                        <!-- 源: 数据库/源 -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round">
                            <ellipse cx="12" cy="5" rx="8" ry="3" />
                            <path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5" />
                            <path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6" />
                        </svg>
                    </span>
                    <span class="stat-text">
                        <span class="lbl">源</span>
                        <b id="stat-source">-</b>
                    </span>
                </div>
            </div>

            <!-- 解码器选择面板 -->
            <div class="decoder-card">
                <div class="decoder-header">
                    <span class="lbl">解码器</span>
                    <select id="decoder-select" autocomplete="off">
                        <option value="custom">自研解析器</option>
                        <option value="pyais">pyais 库</option>
                        <option value="compare">对比模式</option>
                    </select>
                </div>
                <div id="decoder-stats" class="decoder-stats">
                    <span class="mode-tag custom">自研</span>
                </div>
            </div>

            <!-- 对比结果面板 -->
            <div id="compare-panel" class="compare-panel" style="display: none;">
                <div class="compare-header">解码对比结果</div>
                <div id="compare-list" class="compare-list"></div>
            </div>

            <div class="ship-list">
                <div class="ship-list-head">
                    <span>MMSI</span><span>纬度</span><span>经度</span>
                    <span>航速</span><span>航向</span><span>船名</span>
                </div>
                <div id="ship-list-body" class="ship-list-body"></div>
            </div>
        </aside>
    </main>

    <footer class="footer">
        <span class="footer-group">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                 fill="none" stroke="#2dd4bf" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 18l1.5-5h15L21 18" />
                <path d="M5 13V8l7-3 7 3v5" />
                <path d="M12 5V3" />
                <path d="M2 18h20l-2 3H4l-2-3z" />
            </svg>
            <span class="value cyan">AIS Decoding System</span>
        </span>
        <span class="footer-group">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                 fill="none" stroke="#f97316" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2" />
            </svg>
            <span class="label">WebSocket:</span>
            <span class="value orange" id="footer-ws">-</span>
        </span>
        <span class="footer-group">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                 fill="none" stroke="#2dd4bf" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12,3 22,8 12,13 2,8" />
                <polyline points="2,12 12,17 22,12" />
                <polyline points="2,16 12,21 22,16" />
            </svg>
            <span class="label">Leaflet + OpenStreetMap</span>
        </span>
        <span class="footer-group">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                 fill="none" stroke="#2dd4bf" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" />
            </svg>
            <span class="label">由 FastAPI + WebSocket 驱动</span>
        </span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            crossorigin=""></script>
    <script src="/static/js/ws_client.js?v=20260712"></script>
    <script src="/static/js/map.js?v=20260712"></script>
    <script src="/static/js/stats.js?v=20260712"></script>
</body>
</html>
